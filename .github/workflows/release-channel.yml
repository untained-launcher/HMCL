name: Release Channel

on:
  workflow_call:
    inputs:
      channel:
        description: '发布通道名称（dev 或 stable）'
        required: true
        type: string

jobs:
  build:
    name: build-${{ inputs.channel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Prepare signature key
        # The build reads a raw PKCS#8 DER file (KeyFactory + PKCS8EncodedKeySpec),
        # so the secret holds its base64 encoding. A PEM text is accepted as well
        # and is converted here.
        if: ${{ secrets.HMCL_SIGNATURE_KEY != '' }}
        env:
          HMCL_SIGNATURE_KEY_CONTENT: ${{ secrets.HMCL_SIGNATURE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/hmcl-signature-key.der"
          if printf '%s' "$HMCL_SIGNATURE_KEY_CONTENT" | base64 -d > "$KEY_FILE" 2>/dev/null \
             && openssl pkcs8 -inform DER -in "$KEY_FILE" -nocrypt -out /dev/null 2>/dev/null; then
            echo "使用 base64 编码的 PKCS#8 DER 私钥"
          else
            printf '%s' "$HMCL_SIGNATURE_KEY_CONTENT" > "$RUNNER_TEMP/hmcl-signature-key.pem"
            openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/hmcl-signature-key.pem" -outform DER -out "$KEY_FILE"
            echo "已将 PEM 私钥转换为 PKCS#8 DER"
          fi
          echo "HMCL_SIGNATURE_KEY=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew clean makeExecutables makeDeb --stacktrace --no-daemon
        env:
          # HMCL_CI=1 keeps the version scheme identical to the upstream Jenkins build.
          HMCL_CI: '1'
          VERSION_TYPE: ${{ inputs.channel }}
          BUILD_NUMBER: ${{ github.run_number }}
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - name: Read version
        id: version
        run: |
          HMCL_VERSION=$(sed -n 's/^hmcl\.version=//p' HMCL/build/hmcl.properties | tr -d '\r')
          if [ -z "$HMCL_VERSION" ]; then
            echo "::error::cannot determine the version from HMCL/build/hmcl.properties"
            exit 1
          fi
          echo "version=$HMCL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$HMCL_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Built version $HMCL_VERSION"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hmcl-release-${{ inputs.channel }}
          path: HMCL/build/libs/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: release-${{ inputs.channel }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: create-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hmcl-release-${{ inputs.channel }}
          path: artifacts
      - name: Check for existing tags
        env:
          HMCL_TAG_NAME: ${{ needs.build.outputs.tag_name }}
        run: if [ -z "$(git tag -l "$HMCL_TAG_NAME")" ]; then echo "continue=true" >> $GITHUB_ENV; fi
      - name: Verify artifacts
        if: ${{ env.continue == 'true' }}
        run: |
          cd artifacts
          for f in HMCL-*.exe HMCL-*.jar HMCL-*.sh HMCL-*.deb; do
            [ -f "$f" ] || continue
            echo "$(tr -d '\n' < "$f.sha256")  $f" | sha256sum -c
          done
      - name: Generate release note
        if: ${{ env.continue == 'true' }}
        env:
          HMCL_TAG_NAME: ${{ needs.build.outputs.tag_name }}
          HMCL_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
        run: |
          cd artifacts
          PREV_TAG=$(git describe --tags --abbrev=0 "$HMCL_COMMIT_SHA^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$HMCL_COMMIT_SHA"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/$PREV_TAG...$HMCL_COMMIT_SHA"
          else
            RANGE="$HMCL_COMMIT_SHA"
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/$HMCL_COMMIT_SHA"
          fi
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
          echo "COMPARE_URL=$COMPARE_URL" >> "$GITHUB_ENV"

          GH_DOWNLOAD_BASE_URL="https://github.com/${{ github.repository }}/releases/download"
          {
            echo "## 更新日志"
            echo
            echo "[查看完整变更]($COMPARE_URL)"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' -n 50 "$RANGE"
            echo
            echo
            echo "## 下载"
            echo
            echo "| File | SHA-256 Checksum |"
            echo "| --- | --- |"
            for f in HMCL-*.exe HMCL-*.jar HMCL-*.sh HMCL-*.deb; do
              [ -f "$f" ] || continue
              echo "| [$f]($GH_DOWNLOAD_BASE_URL/$HMCL_TAG_NAME/$f) | \`$(tr -d '\n' < "$f.sha256")\` |"
            done
          } > RELEASE_NOTE
          cat RELEASE_NOTE
      - name: Create GitHub release
        if: ${{ env.continue == 'true' }}
        env:
          HMCL_VERSION: ${{ needs.build.outputs.version }}
          HMCL_TAG_NAME: ${{ needs.build.outputs.tag_name }}
          HMCL_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$HMCL_TAG_NAME" \
            artifacts/HMCL-$HMCL_VERSION.exe \
            artifacts/HMCL-$HMCL_VERSION.jar \
            artifacts/HMCL-$HMCL_VERSION.sh \
            artifacts/HMCL-$HMCL_VERSION.deb \
            --target "$HMCL_COMMIT_SHA" \
            --title "$HMCL_TAG_NAME" \
            --notes-file artifacts/RELEASE_NOTE \
            --prerelease
      - name: Install git-cnb
        # Only the upstream repository owns the CNB mirror; forks publish to GitHub only.
        if: ${{ env.continue == 'true' && github.repository_owner == 'HMCL-dev' }}
        run: go install "cnb.cool/looc/git-cnb@$GIT_CNB_VERSION"
        env:
          GIT_CNB_VERSION: '1.1.2'
      - name: Create CNB release
        if: ${{ env.continue == 'true' && github.repository_owner == 'HMCL-dev' }}
        env:
          HMCL_VERSION: ${{ needs.build.outputs.version }}
          HMCL_TAG_NAME: ${{ needs.build.outputs.tag_name }}
          CNB_TOKEN: ${{ secrets.CNB_SYNC_TOKEN }}
          CNB_REPO: HMCL-dev/HMCL
        run: |
          cd artifacts

          echo "Uploading tags to CNB"
          git fetch --tags
          git push "https://cnb:${{ secrets.CNB_SYNC_TOKEN }}@cnb.cool/$CNB_REPO.git" "$HMCL_TAG_NAME"

          echo "Creating CNB release"
          ~/go/bin/git-cnb release create \
             --repo "$CNB_REPO" \
             --tag "$HMCL_TAG_NAME" \
             --name "HMCL $HMCL_VERSION" \
             --body "$(cat RELEASE_NOTE)" \
             --prerelease true

          echo "Uploading HMCL-$HMCL_VERSION.jar"
          ~/go/bin/git-cnb release asset-upload --repo="$CNB_REPO" --tag-name "$HMCL_TAG_NAME" --file-name "HMCL-$HMCL_VERSION.jar"

          echo "Uploading HMCL-$HMCL_VERSION.exe"
          ~/go/bin/git-cnb release asset-upload --repo="$CNB_REPO" --tag-name "$HMCL_TAG_NAME" --file-name "HMCL-$HMCL_VERSION.exe"

          echo "Uploading HMCL-$HMCL_VERSION.sh"
          ~/go/bin/git-cnb release asset-upload --repo="$CNB_REPO" --tag-name "$HMCL_TAG_NAME" --file-name "HMCL-$HMCL_VERSION.sh"

          echo "Uploading HMCL-$HMCL_VERSION.deb"
          ~/go/bin/git-cnb release asset-upload --repo="$CNB_REPO" --tag-name "$HMCL_TAG_NAME" --file-name "HMCL-$HMCL_VERSION.deb"
