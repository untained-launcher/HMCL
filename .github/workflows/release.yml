name: Create Release

on:
  workflow_dispatch:
  schedule:
    # 每日 UTC 18:30（UTC+8 次日 02:30）产出开发版（dev 通道）
    - cron: '30 18 * * *'
    # 每周一 UTC 19:30（UTC+8 周一 03:30）产出稳定版（stable 通道）
    - cron: '30 19 * * 1'

permissions:
  contents: write

jobs:
  release-dev:
    name: release-dev
    if: ${{ github.repository_owner == 'HMCL-dev' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 18 * * *') }}
    uses: ./.github/workflows/release-channel.yml
    with:
      channel: dev
      task: checkUpdateDev
    secrets: inherit

  release-stable:
    name: release-stable
    if: ${{ github.repository_owner == 'HMCL-dev' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 19 * * 1') }}
    uses: ./.github/workflows/release-channel.yml
    with:
      channel: stable
      task: checkUpdateStable
    secrets: inherit
